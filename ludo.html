     .board {
    display: grid;
    grid-template-columns: repeat(15, var(--cell-size));
    grid-template-rows: repeat(15, var(--cell-size));

    background: rgba(255, 255, 255, 0.15);
    border: 3px solid rgba(255,255,255,0.35);
    border-radius: 22px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.45),
        inset 0 2px 8px rgba(255,255,255,0.25),
        inset 0 -3px 8px rgba(0,0,0,0.18);

    padding: 8px;
    position: relative;
     }

    .board::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    pointer-events: none;

    background: linear-gradient(
        135deg,
        rgba(255,255,255,0.28) 0%,
        rgba(255,255,255,0.08) 35%,
        rgba(255,255,255,0) 60%
   );
   }

   .cell {
    border: 1px solid rgba(255,255,255,0.2);
    position: relative;
    box-sizing: border-box;
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.15);
   }
        
   .outer-path-cell { 
    background-color:#ffffff; 
    opacity: 1.5;
   }
  
 
     .token {
     --token-y: -65%;
     --token-scale: 1;
     width: calc(var(--cell-size) * 0.65); 
     height: calc(var(--cell-size) * 0.65); 
     position: absolute; 
     top: 50% !important;
     left: 50% !important;
     border-radius: 50% 50% 50% 0 !important;
     transform: translate3d(-50%, var(--token-y), 0) rotate(-45deg) scale(var(--token-scale));
     border: 3px solid #ffffff !important;
     z-index: 10;
     cursor: pointer;
     transition: all 0.25s ease-in-out, transform 0.1s; 
     box-shadow: 2px 4px 3px rgba(0,0,0,0.6) !important; 
     outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
     }

     /* Base tokens need a slightly smaller, perfectly centred pin. */
     .token-in-base {
        --token-y: -50%;
        --token-scale: 0.78;
        box-sizing: border-box;
     }

     .token-alive {
        pointer-events: auto !important;
        cursor: pointer !important;
        animation: pulse-glow 1.2s infinite;
     }

     @keyframes pulse-glow {
        0% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)); }
        50% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 1)); }
        100% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)); }
     }
     


     .token:active {
     transform: translate(-50%, -60%) rotate(-45deg) scale(0.9) !important;
     }
     

     .token::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 55%;
      height: 55%;
      background-color: #ffffff !important;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0, 2px 4px rgba(0, 0, 0, 0.4);
      z-index: 1;
      }
     
      .token::before{
        content: '';
        display: block !important;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60%;
        height: 60%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
    }

       .token-RED{background-color: #ef4444;}
        .token-RED::after{background-color: #ffffff ;}

        .token-GREEN{background-color: #22a55e;}

        .token-YELLOW{background-color: #eab308;}
        .token-YELLOW::after{background-color: #ffffff;}

        .token-BLUE{background-color: #3b82f6;}

    // --- 1. INITIAL SETUP & VARIABLES ---
    const players = ['RED', 'GREEN', 'YELLOW', 'BLUE'];

    let playingColors = ['RED','GREEN','YELLOW', 'BLUE'];
    let tempSelectedColors = [];
    let currentPlayerIndex = 0; 
    let currentDiceValue = 0;
    let consecutiveSixes = 0;
    let isDiceRolling = false;
    let canHumanRollDice = true;
    let winCrackerInterval = null;
    let waitingForHuman = false;
    let isKillRequired = false;
    let playerKills = {RED: false, GREEN: false, YELLOW: false, BLUE: false};
    let currentGameMode = 'PvP';
    let requiredTokens = 2; 
    let pendingGameMode = ''; 
    let isExtraTurn = false; 
    let playerCustomNames = {};
    let finishOrder = [];
    let humanPlayerColor = 'RED';
    
   
    let tokenData = { 
        RED: [0, 0, 0, 0], 
        GREEN: [0, 0, 0, 0], 
        YELLOW: [0, 0, 0, 0], 
        BLUE: [0, 0, 0, 0] 
    };

    let isMuted = localStorage.getItem('iv_muted') === 'true';

   function updateSoundIcon() {
        const btn = document.getElementById('globalSoundBtn');
        if (!btn) return;
        if (isMuted) {
            btn.innerHTML = '<i class="fas fa-volume-mute"></i><span style="margin-left: 8px;">Unmute</span>';
            btn.style.color = '#ef4444'; 
            btn.style.borderColor = '#ef4444';
        } else {
            btn.innerHTML = '<i class="fas fa-volume-up"></i><span style="margin-left: 8px;">Mute</span>';
            btn.style.color = '#22c55e'; 
            btn.style.borderColor = '#22c55e';
        }
    }

    function toggleSound() {
        if (isGamePaused) return;
        isMuted = !isMuted;
        localStorage.setItem('iv_muted', isMuted);
        updateSoundIcon();
    }
    updateSoundIcon();

    let isGamePaused = false;
    let pausedTimeLeft = 0;

    function pauseGame() {
        if (isGamePaused) return;
        if(isDiceRolling || document.getElementById('leaderboard-modal').style.display === 'flex' || document.getElementById('game-screen').style.display === 'none') return;
        
        isGamePaused = true;
        pausedTimeLeft = timeLeft;
        stopTurnTimer(); 
        
        document.getElementById('pauseModal').style.display = 'flex';
    }

    function resumeGame() {
        isGamePaused = false;
        document.getElementById('pauseModal').style.display = 'none';
        
        if (!isCurrentPlayerAI() && (canHumanRollDice || waitingForHuman)) {
            timeLeft = pausedTimeLeft; 
            resumeTurnTimer(); 
        }

    function playSuiiiSound() {
         if (isMuted) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return; 
        
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine'; 
        
        osc.frequency.setValueAtTime(1200, ctx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.6); 
        
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6); 
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
    }

    // --- 3. DRAW TOKENS ON PATH ---
    // Phone screens use an in-place FLIP transition for moving tokens. This keeps
    // the desktop renderer untouched while removing expensive mobile DOM churn.
    function isMobilePerformanceMode() {
        return window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
    }

    function getTokenCellIndex(color, tokenIndex, position) {
        if (position === 0) return basePositions[color][tokenIndex];
        if (position >= 57) return playerPaths[color][56];
        return playerPaths[color][position - 1];
    }

    function applyTokenLocationStyle(tokenElement, position) {
        tokenElement.classList.toggle('token-in-base', position === 0);
    }

    function moveTokenStepMobile(color, tokenIndex, position, duration) {
        const tokenId = `token-${color}-${tokenIndex}`;
        const tokenElement = document.getElementById(tokenId);
        const cells = document.querySelectorAll('.cell');
        const targetCell = cells[getTokenCellIndex(color, tokenIndex, position)];

        if (!tokenElement || !targetCell) {
            drawTokenStep(color, tokenIndex, position);
            return;
        }

        const startRect = tokenElement.getBoundingClientRect();
        if (tokenElement._ludoMotionTimer) clearTimeout(tokenElement._ludoMotionTimer);
        tokenElement.classList.remove('token-alive', 'token-moving', 'token-Opening', 'token-mobile-animate');
        tokenElement.classList.add('token-mobile-motion');
        tokenElement.style.transform = '';
        tokenElement.style.pointerEvents = 'none';
        applyTokenLocationStyle(tokenElement, position);
        targetCell.appendChild(tokenElement);

        const endRect = tokenElement.getBoundingClientRect();
        const moveX = Math.round((startRect.left + startRect.width / 2) - (endRect.left + endRect.width / 2));
        const moveY = Math.round((startRect.top + startRect.height / 2) - (endRect.top + endRect.height / 2));

        tokenElement.style.setProperty('--mobile-move-x', `${moveX}px`);
        tokenElement.style.setProperty('--mobile-move-y', `${moveY}px`);
        tokenElement.style.setProperty('--mobile-step-duration', `${duration}ms`);
        void tokenElement.offsetWidth;

        requestAnimationFrame(() => {
            if (!tokenElement.isConnected) return;
            tokenElement.classList.add('token-mobile-animate');
            tokenElement.style.setProperty('--mobile-move-x', '0px');
            tokenElement.style.setProperty('--mobile-move-y', '0px');
            tokenElement._ludoMotionTimer = setTimeout(() => {
                if (!tokenElement.isConnected) return;
                tokenElement.classList.remove('token-mobile-animate', 'token-mobile-motion');
                tokenElement.style.removeProperty('--mobile-move-x');
                tokenElement.style.removeProperty('--mobile-move-y');
                tokenElement.style.removeProperty('--mobile-step-duration');
                tokenElement._ludoMotionTimer = null;
            }, duration + 32);
        });
    }

    function drawTokens() {
        document.querySelectorAll('.token').forEach(t => t.remove());
        let cellMap = {};

        players.forEach(color => {
            if (!playingColors.includes(color)) return;
            for(let i = 0; i < 4; i++) {
                let pos = tokenData[color][i];
                let cellIdx;

                if (pos === 0) cellIdx = basePositions[color][i]; 
                else if (pos >= 57) cellIdx = playerPaths[color][56]; 
                else cellIdx = playerPaths[color][pos - 1]; 

                if (!cellMap[cellIdx]) cellMap[cellIdx] = [];
                cellMap[cellIdx].push({ color: color, id: i, pos: pos });
            }
        });

        const cells = document.querySelectorAll('.cell');

        for (let cellIdx in cellMap) {
            let tokensInCell = cellMap[cellIdx];
            let count = tokensInCell.length;

            tokensInCell.forEach((tData, index) => {
                let tokenEl = document.createElement('div');
                tokenEl.className = `token token-${tData.color}`;
                tokenEl.id = `token-${tData.color}-${tData.id}`;
                applyTokenLocationStyle(tokenEl, tData.pos);

                let isClickable = false;

                if(waitingForHuman && tData.color === players[currentPlayerIndex]) {
                    if(tData.pos === 0 && currentDiceValue === 6) { 
                        isClickable = true; 
                    } else if (tData.pos > 0 && tData.pos + currentDiceValue <= 57) { 
                        if(isKillRequired && !playerKills[tData.color] && (tData.pos + currentDiceValue > 51)) {
                            isClickable = false; 
                        } else {
                            isClickable = true; 
                        }
                    }
                }

                if(isClickable) {
                    tokenEl.classList.add('token-alive'); 
                    tokenEl.onclick = function() { handleTokenClick(tData.color, tData.id); };
                } else {
                    tokenEl.style.pointerEvents = 'none'; 
                    tokenEl.onclick = null;
                }

                if (tData.pos > 0 && tData.pos <= 57 && count > 1) {
                    if (count === 2) {
                        if (index === 0) tokenEl.style.transform = 'translate(-90%, -70%) rotate(-45deg) scale(0.75)';
                        if (index === 1) tokenEl.style.transform = 'translate(-10%, -70%) rotate(-45deg) scale(0.75)';
                    } 
                    else if (count === 3) {
                        if (index === 0) tokenEl.style.transform = 'translate(-90%, -90%) rotate(-45deg) scale(0.6)';
                        if (index === 1) tokenEl.style.transform = 'translate(-10%, -90%) rotate(-45deg) scale(0.6)';
                        if (index === 2) tokenEl.style.transform = 'translate(-50%, -30%) rotate(-45deg) scale(0.6)';
                    } 
                    else { 
                        if (index === 0) tokenEl.style.transform = 'translate(-90%, -100%) rotate(-45deg) scale(0.6)';
                        if (index === 1) tokenEl.style.transform = 'translate(-10%, -100%) rotate(-45deg) scale(0.6)';
                        if (index === 2) tokenEl.style.transform = 'translate(-90%, -30%) rotate(-45deg) scale(0.6)';
                        if (index === 3) tokenEl.style.transform = 'translate(-10%, -30%) rotate(-45deg) scale(0.6)';
                        if (index > 3) tokenEl.style.transform = 'translate(-50%, -60%) rotate(-45deg) scale(0.5)';
                    }
                }

                cells[cellIdx].appendChild(tokenEl);
            });

    function drawTokenStep(color, tokenIndex, position) {
        const cells = document.querySelectorAll('.cell');
        const targetCellIndex = getTokenCellIndex(color, tokenIndex, position);
        
        let tokenEl = document.createElement('div');
        tokenEl.className = `token token-${color}`; 
        tokenEl.id = `token-${color}-${tokenIndex}`; 
        tokenEl.style.pointerEvents = 'none';
        applyTokenLocationStyle(tokenEl, position);
        
        tokenEl.onclick = function() { handleTokenClick(color, tokenIndex); };
        cells[targetCellIndex].appendChild(tokenEl);
    }

    function handleTokenClick(color, tokenIndex) {
        if (!waitingForHuman || players[currentPlayerIndex] !== color) return;

        waitingForHuman = false; 
        stopTurnTimer();
        drawTokens(); 

        let currentPos = tokenData[color][tokenIndex];
        let newPos;

        if(isKillRequired && !playerKills[color] &&(currentPos + currentDiceValue > 51)) {
            alert("You must capture an opponent's token before entering the home path!");
            return;
        }

        if (currentPos === 0) {
            if (currentDiceValue === 6) {
                tokenData[color][tokenIndex] = 1; 
                drawTokens(); 

                const exactToken = document.getElementById(`token-${color}-${tokenIndex}`);
                if (exactToken) exactToken.classList.add('token-Opening');
                
                setTimeout(passTurn, 600); 
            } else {
                alert("Needs 6 to open the token!");
                waitingForHuman = false; 
            }
        } else if (currentPos > 0 && currentPos + currentDiceValue <= 57) {
            newPos = currentPos + currentDiceValue;
            moveTokenAnimated(color, tokenIndex, currentPos, newPos);
        } else {
            waitingForHuman = false; 
        }
    }

    function moveTokenAnimated(color, tokenIndex, startPos, endPos) {
        const mobilePerformanceMode = isMobilePerformanceMode();
        let delay = mobilePerformanceMode ? 145 : 350;
        let currentStep = startPos;
        
        const aiStatus = document.getElementById('ai-status');
        if(aiStatus) aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn" : "Player turn";

        function step() {
            currentStep++;
            tokenData[color][tokenIndex] = currentStep;
            
            tokenSound.currentTime = 0.1; 
            if (!isMuted) tokenSound.play(); 

            if (mobilePerformanceMode) {
                moveTokenStepMobile(color, tokenIndex, currentStep, 112);
            } else {
                const exactTokenId = `token-${color}-${tokenIndex}`;
                const tokenElement = document.getElementById(exactTokenId);
                if(tokenElement) tokenElement.remove();

                drawTokenStep(color, tokenIndex, currentStep);

                const newTokenElement = document.getElementById(exactTokenId);
                if(newTokenElement)
                    newTokenElement.classList.add('token-moving');
            }

            if (currentStep < endPos) {
                setTimeout(step, delay); 
            } else {
                let absolutePos = playerPaths[color][currentStep - 1]; 
                let killed = false;

               if (currentStep <= 51 && !safeZones.includes(absolutePos)) {
                    players.forEach(otherColor => {
                        if (otherColor !== color) { 
                            let tokensAtPos = []; 
                            for(let i = 0; i < 4; i++) {
                                let otherStep = tokenData[otherColor][i];
                                if (otherStep > 0 && otherStep <= 51) {
                                    let otherAbsolute = playerPaths[otherColor][otherStep - 1];
                                    
                                    if(absolutePos === otherAbsolute) {
                                        tokensAtPos.push(i); 
                                    }
                                }
                            }

                            if(tokensAtPos.length === 1) { 
                                let killedIndex = tokensAtPos[0];
                                let killedFromPos = tokenData[otherColor][killedIndex];
                                returnTokenToHomeAnimated(otherColor, killedIndex, killedFromPos);
                                killed = true;
                                playerKills[color] = true;
                            }
                        }
                    });
                }
               
                if (killed) {
                    if (aiStatus) aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn completed" : "Player turn completed";
                    isExtraTurn = true; 
                    setTimeout(passTurn, 2500);
                } 
                else if (currentStep === 57) {
                    if (typeof winSound != 'undefined') {
                        winSound.currentTime = 0; 
                        if (!isMuted) winSound.play();
                    }

                    if (aiStatus) aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn completed" : "Player turn completed";
                    
                    if (hasPlayerWon(color)) {
                        isExtraTurn = false;
                    } else {
                        isExtraTurn = true;
                    } 
                    
                    if (checkWinCondition()) return;
                  
                    drawTokens();
                    setTimeout(passTurn, 600);
                } 
                else {
                    
                    if (safeZones.includes(absolutePos)) {
                        if(typeof safeZoneSound != 'undefined') {
                            safeZoneSound.currentTime = 0;
                             if (!isMuted) safeZoneSound.play();
                        }
                    }

                    if (aiStatus) aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn completed" : "Player turn completed";
                    drawTokens();
                    setTimeout(passTurn, 600);
                }
            }
        }
        setTimeout(step, delay);
    }
 
    function returnTokenToHomeAnimated(color, tokenIndex,currentPos) {
        const mobilePerformanceMode = isMobilePerformanceMode();
        let delay = mobilePerformanceMode ? 56 : 35;
        let stepPos = currentPos;
        const aiStatus = document.getElementById('ai-status');
        if(aiStatus) aiStatus.innerText = `${color} Token returning to base!`;

        playSuiiiSound();

        function stepBack() {
            if(stepPos > 0) {
                stepPos--;
                tokenData[color][tokenIndex] = stepPos;

                if (mobilePerformanceMode) {
                    moveTokenStepMobile(color, tokenIndex, stepPos, 40);
                } else {
                    const exactTokenId = `token-${color}-${tokenIndex}`;
                    const tokenElement = document.getElementById(exactTokenId);
                    if(tokenElement) tokenElement.remove();

                    drawTokenStep(color, tokenIndex, stepPos);
                }

                setTimeout(stepBack, delay);
            } else {
                drawTokens();
            }
        }
        stepBack();
    }
            
   function playAITurn() {
        const aiStatus = document.getElementById('ai-status');
        let color = players[currentPlayerIndex];
        let bestMove = null;
        let bestScore = -999999;

        function absPos(playerColor, step) {
            if (step <= 0 || step > 51) return null;
            return playerPaths[playerColor][step - 1];
        }

        function enemyAt(cell, selfColor) {
            for (let p of players) {
                if (p === selfColor) continue;
                let count = 0;
                for (let i = 0; i < 4; i++) {
                    let pos = tokenData[p][i];
                    if (pos > 0 && pos <= 51) {
                        if (absPos(p, pos) === cell) count++;
                    }
                }
                if(count=== 1) return true;
            }
            return false;
        }

        function futureDanger(cell, selfColor) {
            let risk = 0;
            for (let p of players) {
                if (p === selfColor) continue;
                for (let i = 0; i < 4; i++) {
                    let pos = tokenData[p][i];
                    if (pos > 0 && pos <= 51) {
                        let enemyCell = absPos(p, pos);
                        for (let dice = 1; dice <= 6; dice++) {
                            let next = pos + dice;
                            if (next <= 51) {
                                let nextCell = absPos(p, next);
                                if (nextCell === cell) {
                                    risk += 300;
                                }
                            }
                        }
                    }
                }
            }
            return risk;
        }

        function futureKillChance(step, selfColor) {
            let chance = 0;
            if (step <= 0 || step > 51) return 0;
            let cell = absPos(selfColor, step);
            for (let dice = 1; dice <= 6; dice++) {
                let futureStep = step + dice;
                if (futureStep <= 51) {
                    let futureCell = absPos(selfColor, futureStep);
                    if (futureCell && enemyAt(futureCell, selfColor) && !safeZones.includes(futureCell)) {
                        chance += 500;
                    }
                }
            }
            return chance;
        }

        for (let i = 0; i < 4; i++) {
            let pos = tokenData[color][i];
            
            if (pos === 0 && currentDiceValue === 6) {
                let score = 1000;
                let startCell = absPos(color, 1);

                if (enemyAt(startCell, color)) score += 2500;
                score += futureKillChance(1, color);

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = { type: "open", index: i };
                }
            }
            else if (pos > 0 && pos + currentDiceValue <= 57) {
                let nextPos = pos + currentDiceValue;

                if(isKillRequired && !playerKills[color] && nextPos > 51) {
                    continue;
                }
                let score = 0;
                let targetCell = nextPos <= 51 ? absPos(color, nextPos) : playerPaths[color][56];

                if (nextPos === 57) score += 10000;
                
                if (nextPos <= 51 && enemyAt(targetCell, color) && !safeZones.includes(targetCell)) {
                    score += 1800;
                }

                if (safeZones.includes(targetCell)) score += 1500;

                let currentCell = absPos(color, pos);
                let oldRisk = futureDanger(currentCell, color);
                let newRisk = futureDanger(targetCell, color);

                if (newRisk < oldRisk) score += 800;

                score += futureKillChance(nextPos, color);
                score += nextPos * 25;
                if (nextPos > 45) score += 600;
                score -= newRisk;

                for (let j = 0; j < 4; j++) {
                    if (j !== i) {
                        let other = tokenData[color][j];
                        if (other > 0 && other <= 51) {
                            let otherCell = absPos(color, other);
                            if (otherCell === targetCell) score += 700;
                        }
                    }
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = { type: "move", index: i };
                }
            }
        }

        if (!bestMove) {
            aiStatus.innerText = "Computer turn completed";
            setTimeout(passTurn, 800);
            return;
        }

        let idx = bestMove.index;

        if (bestMove.type === "open") {
            tokenData[color][idx] = 1;
            aiStatus.innerText = "Computer turn completed";
            drawTokens();
            setTimeout(passTurn, 600);
        } else {
            let start = tokenData[color][idx];
            let end = start + currentDiceValue;
            aiStatus.innerText = "Computer turn";
            moveTokenAnimated(color, idx, start, end);
        }
    }

        return false;

    function getSmartAIDiceValue(color) {
        let randomChance = Math.random();
        let allTokensAtBase = true;
        
        for(let i=0; i<4; i++) {
            if(tokenData[color][i] !== 0) {
                allTokensAtBase = false;
                break;
            }
        }

        if(allTokensAtBase) {
            if (randomChance < 0.166) { 
                return 6; 
            } else { 
                return Math.floor(Math.random() * 5) + 1; 
            }
        } else {
            return Math.floor(Math.random() * 6) + 1;
        }
    }

    function executeTurn () {
        isDiceRolling = true;
        const currentDiceBox = document.getElementById(`dice-${players[currentPlayerIndex].toLowerCase()}`);
        const diceInner = currentDiceBox.querySelector('.dice-inner');
        const aiStatus = document.getElementById('ai-status');

        if(typeof diceSound != 'undefined') {
            diceSound.currentTime = 0;
            if (!isMuted) diceSound.play();
        }
        
        currentDiceBox.classList.add('rolling');
        aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn" : "Player turn";

        let flickerTimer = setInterval (() => {
            let randomFace = Math.floor(Math.random() * 6) + 1;
            drawDots(diceInner, randomFace); 
        }, 50);
        
        setTimeout (() => {
            clearInterval(flickerTimer);
            currentDiceBox.classList.remove('rolling'); 

            let diceValue;

            if(isCurrentPlayerAI()) {
                diceValue = getSmartAIDiceValue(players[currentPlayerIndex]);
            } else {
                let currentColor = players[currentPlayerIndex];
                let allTokensAtBase = true;
            
            for(let i=0; i<4; i++) {
                if(tokenData[currentColor][i] !== 0) {
                    allTokensAtBase = false;
                    break;
                }
            }

            let randomChance = Math.random();

            if(allTokensAtBase) {
                if (randomChance < 0.16) {
                    diceValue = 6;
                } else {
                    diceValue = Math.floor(Math.random() * 5) + 1;
                }
            } else {
                if (randomChance < 0.16) {
                    diceValue = 6;
                } else {
                    diceValue = Math.floor(Math.random() * 5) + 1;
                }
            }
        }

            currentDiceValue = diceValue; 
            drawDots(diceInner, diceValue); 

            if(diceValue === 6) {
                consecutiveSixes++;
            } else {
                consecutiveSixes = 0;
            }

            if(consecutiveSixes === 3) {
                aiStatus.innerText = isCurrentPlayerAI() ? "Computer turn completed" : "Player turn completed";
                canHumanRollDice = false;
                isExtraTurn = false; 
                
                setTimeout(() => {
                    isDiceRolling = false;
                    passTurn();
            }, 1500);
            return;
        }

            if(isCurrentPlayerAI()) {
                setTimeout(playAITurn, 800);
            } else {
                let color = players[currentPlayerIndex];
                let movableTokens = [];

                for(let i=0; i<4; i++) {
                    let pos = tokenData[color][i];
                    if((pos === 0 && diceValue === 6) || (pos > 0 && pos + diceValue <= 57)) {
                        movableTokens.push(i);
                    }
                }
                if (movableTokens.length === 1) {
                    let idx = movableTokens[0];
                    let pos =tokenData[color][idx];
                    
                    canHumanRollDice = false;
                    aiStatus.innerText = "Player turn";

                    setTimeout(() => {
                        if(pos === 0 && diceValue === 6) {
                            tokenData[color][idx] = 1; 
                            drawTokens();
                            const exactToken = document.getElementById(`token-${color}-${idx}`);
                            if(exactToken) exactToken.classList.add('token-Opening');
                            setTimeout(passTurn, 600);
                        } else {
                            let newPos = pos + diceValue;
                            moveTokenAnimated(color, idx, pos, newPos);
                        }
                    }, 300);
                }else if (movableTokens.length > 1) {
                    waitingForHuman = true;
                    isDiceRolling = false;
                    canHumanRollDice = false;
                    aiStatus.innerText = "Player turn";
                    drawTokens();
                    startTurnTimer();
                } else {
                    aiStatus.innerText = "Player turn completed";
                    canHumanRollDice = false;

                    setTimeout(() => {
                        isDiceRolling = false;
                        passTurn();
                    }, 1200);
                }
            }
        }, 600);
    }

function hasPlayerWon(color) {
    let wins = 0;
    for(let i=0; i<4; i++){
        if(tokenData[color][i] === 57) wins++;
    }
    return wins === 4;
}   

function passTurn(isTimeout = false) {
        stopTurnTimer();
        waitingForHuman = false; 
        isDiceRolling = false;
        
        saveGameState(); 

        if (isTimeout) {
            isExtraTurn = false;
            consecutiveSixes = 0;
            currentDiceValue = 0; 
            
            do {
                currentPlayerIndex = (currentPlayerIndex + 1) % 4;
            } while (!playingColors.includes(players[currentPlayerIndex]) || hasPlayerWon(players[currentPlayerIndex]));
        } 
        else {
            if (hasPlayerWon(players[currentPlayerIndex])) {
                isExtraTurn = false; 
                consecutiveSixes = 0; 
             
                do {
                    currentPlayerIndex = (currentPlayerIndex + 1) % 4;
                } while (!playingColors.includes(players[currentPlayerIndex]) || hasPlayerWon(players[currentPlayerIndex]));
            }
            else if (isExtraTurn) {
                isExtraTurn = false;
                consecutiveSixes = 0;
            }
            else if (currentDiceValue !== 6 || consecutiveSixes >= 3) {
                consecutiveSixes = 0;

                do {
                    currentPlayerIndex = (currentPlayerIndex + 1) % 4;
                } while (!playingColors.includes(players[currentPlayerIndex]) || hasPlayerWon(players[currentPlayerIndex]));
            }
        }

        updateTurnUI();
    }

            spark.style.top = startY + '%';
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = 80 + Math.random() * 200; 
        const tx = Math.cos(angle) * velocity + 'px';     
        const ty = Math.sin(angle) * velocity + 'px';
        
        spark.style.setProperty('--tx', tx);
        spark.style.setProperty('--ty', ty);

        let duration = 0.8 + Math.random() * 0.7;
        spark.style.animation = `firework-explode ${duration}s ease-out forwards`;

        container.appendChild(spark);

        setTimeout(() => spark.remove(), duration * 1000);
    }
}

        function generateConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ef4444', '#22c55e', '#eab308', '#3b83f6'];

            for (let i = 0; i < 100; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(confetti);
            }

            if(winCrackerInterval) clearInterval(winCrackerInterval);

            launchFirework();
            setTimeout(launchFirework, 300);
            setTimeout(launchFirework, 600);
            setTimeout(launchFirework, 900);

            winCrackerInterval = setInterval(() => {
                if (typeof winSound != 'undefined') {
                    winSound.currentTime = 0;
                    winSound.play();
                }

                launchFirework();
                setTimeout(launchFirework, 350);
                setTimeout(launchFirework, 700);
                setTimeout(launchFirework, 1100);
                setTimeout(launchFirework, 1500);
            }, 2000);
        }  
        
        function checkWinCondition() {
        
            players.forEach(color => {
                if(playingColors.includes(color) && !finishOrder.includes(color)) {
                    let score = 0;
                    for(let i=0; i<4; i++){
                        if(tokenData[color][i] === 57) score++;
                    }
                    if (score === 4) finishOrder.push(color);
                }   
            });

            if(finishOrder.length > 0) {
                finishOrder.forEach((pColor, index) => {
                    let rankNum = index + 1;
                    drawRankBadgesOnBoard(pColor , rankNum);
                });
            }

            if(finishOrder.length >= playingColors.length - 1 ) {

                players.forEach(color => {
                    if(playingColors.includes(color) && !finishOrder.includes(color)) {
                        finishOrder.push(color)
                    }
                })
                showLeaderboard();
              return true;
            }
            return false;
        }

        function drawRankBadgesOnBoard(color, rankNum) {
            const cells = document.querySelectorAll('.cell');
            document.querySelectorAll(`.rank-badge-${color}`).forEach(b => b.remove());

            const centerCells = { RED: 32, GREEN: 41, BLUE: 167, YELLOW: 176 };
            const baseCenterIdx = centerCells[color];

            let badgeHtml = '';
            const badgeColor = playerColors[players.indexOf(color)];
        
        if(rankNum === 1) {
            badgeHtml = `<div class="rank-badge rank-badge-${color}" style="position: absolute; width: 200%; height: 200%; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; pointer-events: none;">
                <div style="font-size: 45px; margin-bottom: -15px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); z-index: 2;">👑</div>
                <div style="font-size: 18px; color: ${badgeColor}; font-weight: 900; background: rgba(255,255,255,0.95); padding: 4px 12px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid ${badgeColor}; z-index: 1;">1st</div>
            </div>`;
        } else {
            badgeHtml = `<div class="rank-badge rank-badge-${color}" style="position: absolute; width: 200%; height: 200%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; z-index: 50; pointer-events: none;">
                <div style="font-size: 18px; color: ${badgeColor}; font-weight: 900; background: #ffffff; padding: 4px 12px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid ${badgeColor};"> ${rankNum}${rankNum===2?'nd':rankNum===3?'rd':'th'} </div>
            </div>`;
        }
        cells[baseCenterIdx].innerHTML += badgeHtml;
    }
      
        function confirmExit() {
            localStorage.removeItem('ludo_saved_game');
            window.location.href = 'index.html';
        }

    const resumeModal = document.getElementById('resumeModal');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');

    let savedData = localStorage.getItem('ludo_saved_game');
    if (savedData) {
        resumeModal.style.display = 'flex';
    }

    resumeBtn.addEventListener('click', () => {
        resumeModal.style.display = 'none';
        let data = JSON.parse(localStorage.getItem('ludo_saved_game'));
        
        if (data) {
            tokenData = data.tokenData;
            currentPlayerIndex = data.currentPlayerIndex;
            currentDiceValue = data.currentDiceValue;
            playingColors = data.playingColors;
            isKillRequired = data.isKillRequired;
            playerKills = data.playerKills;
            currentGameMode = data.currentGameMode;
            playerCustomNames = data.playerCustomNames;
            finishOrder = data.finishOrder;
            humanPlayerColor = data.humanPlayerColor;
            isExtraTurn = data.isExtraTurn;
            consecutiveSixes = data.consecutiveSixes;

         
            const toggle = document.getElementById('kill-rule-toggle');
            if (toggle) toggle.checked = isKillRequired;

            players.forEach(color => {
                let panel = document.getElementById(`panel-${color.toLowerCase()}`);
                if(playingColors.includes(color)) {
                    panel.style.display = 'flex'; 
                } else {
                    panel.style.display = 'none'; 
                }
            });

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('game-controls').style.display = 'block'
            
            generateBoard();
            beautifyBoard();
            drawTokens();
            updateTurnUI();
            
           
            if(isCurrentPlayerAI() && currentDiceValue === 0 && !isDiceRolling) {
                setTimeout(executeTurn, 1000);
            }
        }
    });

    restartBtn.addEventListener('click', () => {
        resumeModal.style.display = 'none';
        localStorage.removeItem('ludo_saved_game');
    });

</script>
