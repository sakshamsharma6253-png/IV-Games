<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku Mini & Classic</title>
<style>
  /* --- GLOBAL STYLES --- */
  * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      user-select: none;
  }
  
  body { 
      background: #D4C4FB; 
      color: #111; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden; 
  }

  /* --- HOME SCREEN --- */
  #homeScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
  }

  .main-title {
      font-size: 3.5rem;
      font-weight: 900;
      background: #fff;
      border: 5px solid #111;
      padding: 10px 30px;
      box-shadow: 8px 8px 0px #111;
      transform: rotate(-3deg);
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
  }

  .menu-card {
      width: 220px;
      background: #fff;
      border: 4px solid #111;
      box-shadow: 6px 6px 0px #111;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
      cursor: pointer;
      font-size: 1.8rem;
      font-weight: bold;
      transition: 0.1s;
      border-radius: 8px;
  }

  .menu-card:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px #111; }
  .menu-card.mini { background: #ffeb3b; } 
  .menu-card.medium { background: #f0ebff; } 
  .menu-card.classic { background: #ff9800; } 

  /* --- GAME SCREEN --- */
  #gameScreen {
      display: none; 
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
  }

  .header {
      width: 100%;
      background: #111;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
  }
  
  .back-btn { cursor: pointer; color: #ffeb3b; }
  
  .toolbar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 700;
  }
  
  .toolbar-badge {
      background: #f0ebff;
      padding: 5px 12px;
      border-radius: 8px;
      border: 2px solid #111;
      box-shadow: 2px 2px 0px #111;
  }

  .dropdown-panel {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background: #fff;
      border: 2px solid #111;
      box-shadow: 4px 4px 0px #111;
      border-radius: 8px;
      width: 100%;
      z-index: 10;
      overflow: hidden;
  }

  .dropdown-option {
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      text-align: center;
      border-bottom: 2px solid #111;
  }

  .dropdown-option:last-child { border-bottom: none; }
  .dropdown-option:hover { background: #ffeb3b; }

  /* --- SUDOKU GRID --- */
  .grid-wrapper {
      margin-top: 5px;
      background: #fff;
      border: 4px solid #111;
      box-shadow: 8px 8px 0px #111;
      border-radius: 4px;
  }
  
  table { border-collapse: collapse; }
  
  td { 
      border: 1px solid #111; 
      text-align: center; 
      font-weight: 700;
      cursor: pointer;
  }

  /* Dynamic CSS sizes depending on grid size */
  .grid-4 td, .grid-6 td { width: 55px; height: 55px; font-size: 28px; }
  .grid-9 td { width: 35px; height: 35px; font-size: 22px; } /* Smaller cells for 9x9 */

  .selected { background-color: #ffeb3b !important; }
  .fixed { color: #111; }
  .user-input { color: #0066cc; }

  /* --- ON-SCREEN KEYPAD --- */
  .keypad-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
  }
  
  .keypad-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap; /* Allows wrapping on very small screens */
  }

  .btn {
      background: #fff;
      border: 3px solid #111;
      box-shadow: 4px 4px 0px #111;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      width: 50px;
      height: 48px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
  }
  
  .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #111;
  }

  .btn-action { background: #A0E8AF; font-size: 14px; width: 65px; line-height: 1.1; }
  .btn-wide { width: 100px; font-size: 15px; background: #A0E8AF; margin-top: 5px;}

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }

  .modal-box {
    background: #fff;
    border: 4px solid #111;
    box-shadow: 8px 8px 0 #111;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    max-width: 80%;
    transform: rotate(-1deg);
  }
</style>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalMessage">Message</h3>
            <div class="btn btn-wide" style="margin: 0 auto; width: 120px;" onclick="closeModal()">OK</div>
        </div>
    </div>

    <div id="homeScreen">
        <div class="main-title">Sudoku</div>
        
        <div class="menu-card mini" onclick="showGame(4)">4 x 4<br><span style="font-size: 1rem; font-weight: normal;">Mini</span></div>
        <div class="menu-card medium" onclick="showGame(6)">6 x 6<br><span style="font-size: 1rem; font-weight: normal;">Medium</span></div>
        <div class="menu-card classic" onclick="showGame(9)">9 x 9<br><span style="font-size: 1rem; font-weight: normal;">Classic</span></div>
    </div>

    <div id="gameScreen">
        <div class="header">
            <span class="back-btn" onclick="goHome()">← Back</span>
            <span id="headerTitle">6x6 Sudoku</span>
            <span style="cursor:pointer;" onclick="newPuzzle()">↺ New</span>
        </div>

        <div class="toolbar">
            <div style="position: relative;">
                <div class="toolbar-badge" id="difficultyBtn" style="cursor: pointer;">Medium ⌄</div>
                
                <div id="difficultyPanel" class="dropdown-panel">
                    <div class="dropdown-option" onclick="selectDifficulty('Easy')">Easy</div>
                    <div class="dropdown-option" onclick="selectDifficulty('Medium')">Medium</div>
                    <div class="dropdown-option" onclick="selectDifficulty('Hard')">Hard</div>
                </div>
            </div>
            
            <div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
                <div id="puzzleId" style="font-weight: 800;">#1878</div>
                <div id="pauseBtn" style="font-size: 0.8rem; margin-top: 5px; cursor: pointer; background: #fff; border: 2px solid #111; padding: 2px 10px; border-radius: 6px; box-shadow: 2px 2px 0 #111;">⏸ Pause</div>
            </div>
            
            <div id="timerDisplay">⏱ 00:00</div>
        </div>

        <div class="grid-wrapper">
            <table id="grid"></table>
        </div>

        <div class="keypad-container">
            <div class="keypad-row">
                <div class="btn num-btn">1</div>
                <div class="btn num-btn">2</div>
                <div class="btn num-btn">3</div>
                <div class="btn num-btn">4</div>
                <div class="btn num-btn" id="btn-5">5</div>
            </div>
            <div class="keypad-row">
                <div class="btn num-btn" id="btn-6">6</div>
                <div class="btn num-btn" id="btn-7">7</div>
                <div class="btn num-btn" id="btn-8">8</div>
                <div class="btn num-btn" id="btn-9">9</div>
                <div class="btn btn-action" id="eraseBtn" style="width: 50px;">X<br><span style="font-size: 9px;">Erase</span></div>
            </div>
            <div class="keypad-row">
                <div class="btn btn-wide" onclick="newPuzzle()">↺ Restart</div>
                <div class="btn btn-action" id="checkBtn" style="width: 80px;">✓ Check</div>
                <div class="btn btn-action" id="hintBtn" style="width: 80px;">✨ Hint</div>
            </div>
            <div class="keypad-row">
                <div class="btn btn-wide" id="solveBtn" style="width: 200px;">💡 Solve Grid</div>
            </div>
        </div>
    </div>

<script>
    let currentSize = 6;
    let blockRows = 2, blockCols = 3;
    let cur;
    let selectedCell = null;
    let timerInterval;
    let secondsElapsed = 0;
    let currentDifficulty = 'Medium';
    let isGameWon = false;
    const table = document.getElementById('grid'); 

    function showModal(msg) {
        document.getElementById('modalMessage').innerText = msg;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
        if (isGameWon === true) {
            isGameWon = false;
            newPuzzle();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsElapsed = 0;
        timerInterval = setInterval(function() {
            secondsElapsed++;
            let m = Math.floor(secondsElapsed / 60);
            let s = secondsElapsed % 60;
            let formattedTime = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
            document.getElementById('timerDisplay').innerText = "⏱ " + formattedTime;
        }, 1000);
    }

    // --- NAVIGATION LOGIC ---
    function showGame(size) {
        currentSize = size;
        if(size === 4) { blockRows = 2; blockCols = 2; table.className = "grid-4"; }
        else if(size === 6) { blockRows = 2; blockCols = 3; table.className = "grid-6"; }
        else if(size === 9) { blockRows = 3; blockCols = 3; table.className = "grid-9"; } // Added 9x9 Logic
        
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        
        document.getElementById('headerTitle').innerText = size + "x" + size + " Sudoku";
        document.getElementById('difficultyBtn').innerText = currentDifficulty + " ⌄";
        
        // Dynamically Show/Hide Keypad Buttons based on game mode
        document.getElementById('btn-5').style.display = size >= 5 ? 'flex' : 'none';
        document.getElementById('btn-6').style.display = size >= 6 ? 'flex' : 'none';
        document.getElementById('btn-7').style.display = size >= 9 ? 'flex' : 'none';
        document.getElementById('btn-8').style.display = size >= 9 ? 'flex' : 'none';
        document.getElementById('btn-9').style.display = size >= 9 ? 'flex' : 'none';
        
        newPuzzle();
    }

    function goHome() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('homeScreen').style.display = 'flex';
        clearInterval(timerInterval); 
    }

    // --- DROPDOWN LOGIC ---
    document.getElementById('difficultyBtn').addEventListener('click', function(event) {
        const panel = document.getElementById('difficultyPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        event.stopPropagation(); 
    });

    function selectDifficulty(level) {
        currentDifficulty = level; 
        document.getElementById('difficultyBtn').innerText = level + " ⌄"; 
        document.getElementById('difficultyPanel').style.display = 'none'; 
        newPuzzle(); 
    }

    document.addEventListener('click', function(event) {
        const panel = document.getElementById('difficultyPanel');
        if (panel && event.target.id !== 'difficultyBtn') {
            panel.style.display = 'none';
        }
    });

    // --- SUDOKU LOGIC (Added 9x9) ---
    const base4 = [[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
    const base6 = [[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,1,5,6,4],[5,6,4,2,3,1],[3,1,2,6,4,5],[6,4,5,3,1,2]];
    const base9 = [
        [5,3,4,6,7,8,9,1,2],
        [6,7,2,1,9,5,3,4,8],
        [1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],
        [4,2,6,8,5,3,7,9,1],
        [7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],
        [2,8,7,4,1,9,6,3,5],
        [3,4,5,2,8,6,1,7,9]
    ];

    function makePuzzle(){ 
        let base;
        if (currentSize === 4) base = base4;
        else if (currentSize === 6) base = base6;
        else base = base9;

        let p = base.map(r => r.slice()); 
        
        // Difficulty Logic
        let removals;
        if(currentSize === 4) {
            if(currentDifficulty === 'Easy') removals = 6;
            else if(currentDifficulty === 'Medium') removals = 8;
            else removals = 10;
        } else if (currentSize === 6) {
            if (currentDifficulty === 'Easy') removals = 15;
            else if (currentDifficulty === 'Medium') removals = 20;
            else removals = 24;
        } else if (currentSize === 9) {
            if (currentDifficulty === 'Easy') removals = 35; // Standard 9x9 removals
            else if (currentDifficulty === 'Medium') removals = 45;
            else removals = 55;
        }

        for(let k=0; k < removals; k++){ 
            let i = Math.floor(Math.random() * currentSize);
            let j = Math.floor(Math.random() * currentSize); 
            p[i][j] = 0; 
        }
        return {puzzle: p, solution: base};
    }

    function render(p){ 
        table.innerHTML=''; 
        for(let r=0; r < currentSize; r++){ 
            const tr = document.createElement('tr'); 
            for(let c=0; c < currentSize; c++){ 
                const td = document.createElement('td'); 
                const v = p[r][c]; 
                
                if (c % blockCols === blockCols - 1 && c !== currentSize - 1) td.style.borderRight = '4px solid #111';
                if (r % blockRows === blockRows - 1 && r !== currentSize - 1) td.style.borderBottom = '4px solid #111';

                td.dataset.r = r; td.dataset.c = c;

                if(v){ 
                    td.textContent = v; 
                    td.classList.add('fixed'); 
                } else {
                    td.textContent = "";
                }
                
                td.addEventListener('click', function() {
                    document.querySelectorAll('td').forEach(cell => cell.classList.remove('selected'));
                    td.classList.add('selected');
                    selectedCell = td;
                });
                tr.appendChild(td); 
            } 
            table.appendChild(tr); 
        } 
    }

    function newPuzzle(){ 
        cur = makePuzzle(); 
        render(cur.puzzle); 
        selectedCell = null;
        startTimer();
        document.getElementById('puzzleId').innerText = "#" + Math.floor(1000 + Math.random() * 9000);

        isPaused = false;
        const pBtn = document.getElementById('pauseBtn');
        if(pBtn) {
            pBtn.innerText = "⏸ Pause";
            pBtn.style.background = "#fff";
        }
        document.getElementById('grid').style.visibility = 'visible';
    }

    // --- KEYPAD LOGIC ---
    document.querySelectorAll('.num-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if(selectedCell && !selectedCell.classList.contains('fixed')) {
                selectedCell.textContent = this.innerText;
                selectedCell.classList.add('user-input');
            }
        });
    });

    document.getElementById('eraseBtn').addEventListener('click', function() {
        if(selectedCell && !selectedCell.classList.contains('fixed')) {
            selectedCell.textContent = "";
        }
    });

    document.getElementById('checkBtn').addEventListener('click', function(){ 
        const sol = cur.solution; 
        let ok = true, isFull = true;

        for(let r=0; r < currentSize; r++){
            for(let c=0; c < currentSize; c++){ 
                const td = table.rows[r].cells[c];
                const val = +(td.textContent || 0);
                if(val === 0) isFull = false;
                if(val !== 0 && val !== sol[r][c]){
                    ok = false;
                    td.style.color = "red"; 
                    setTimeout(() => { if(!td.classList.contains('fixed')) td.style.color = "#0066cc"; }, 1000);
                }
            }
        }
        
        if(ok && isFull) {
            isGameWon = true;
            showModal('Perfect! You solved it! 🎉'); 
            clearInterval(timerInterval);
        }
        else if(ok && !isFull) {
            showModal('Looking good so far, keep going! 👍');
        }
        else {
            showModal('Some cells are incorrect. Try again! ❌'); 
        }
    });

    document.getElementById('solveBtn').addEventListener('click', function(){ 
        render(cur.solution); 
        clearInterval(timerInterval); 
    });

    document.getElementById('hintBtn').addEventListener('click', function() {
        let targetCell = null;
        if (selectedCell && selectedCell.textContent === "") {
            targetCell = selectedCell;
        } else {
            for (let r=0; r < currentSize; r++) {
                for (let c=0; c < currentSize; c++) {
                    const td = table.rows[r].cells[c];
                    if(td.textContent === "") {
                        targetCell = td;
                        break;
                    }
                }
                if (targetCell) break;
            }
        }

        if (targetCell) {
            let r = targetCell.dataset.r;
            let c = targetCell.dataset.c;
            
            targetCell.textContent = cur.solution[r][c];
            targetCell.style.color = "#FF9F1C"; 
            
            setTimeout(() => {
                if (!targetCell.classList.contains('user-input')) {
                    targetCell.textContent = ""; 
                    targetCell.style.color = ""; 
                }
            }, 1500);
        }
    });

    let isPaused = false;
    document.getElementById('pauseBtn').addEventListener('click', function() {
        if (!isPaused) {
            isPaused = true;
            clearInterval(timerInterval);
            this.innerText = "▶ Resume";
            this.style.background = "#ffeb3b";
            document.getElementById('grid').style.visibility = 'hidden';
        } else {
            isPaused = false;
            this.innerText = "⏸ Pause";
            this.style.background = "#fff";
            document.getElementById('grid').style.visibility = 'visible';

            timerInterval = setInterval(function() {
                secondsElapsed++;
                let m = Math.floor(secondsElapsed / 60);
                let s = secondsElapsed % 60;
                let formattedTime = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                document.getElementById('timerDisplay').innerText = "⏱ " + formattedTime; 
            }, 1000);
        }
    });
</script>
</body>
</html>
