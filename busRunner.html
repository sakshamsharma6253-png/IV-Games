<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Runner - Play Free Endless Runner | ITVoice Games</title>
  <meta name="description" content="Play Bus Runner online for free at ITVoice Games. Dodge obstacles, and set a high score in this fast-paced, endless runner web game!">
  <link rel="canonical" href="https://itvoicegames.com/busRunner.html">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Informatic Computech Private Limited">
  <link id="favicon" rel="icon" type="image/webp" href="favicon/favicon.dark.webp"> 
  <meta name="theme-color" id="meta-theme-color" content="#0a0a0a">

  <meta property="og:title" content="Bus Runner - Play Free Endless Runner | ITVoice Games">
  <meta property="og:description" content="Dodge obstacles, collect coins, and set a high score in this fast-paced, endless runner web game!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://itvoicegames.com/busRunner.html">
  <meta property="og:image" content="https://itvoicegames.com/assets/busRunner-logo.jpg">
  <meta property="og:site_name" content="ITVoice Games">
  <meta property="og:locale" content="en_US">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: Arial, sans-serif;
      user-select: none;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none; 
    }

    .dash-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #fff;
      z-index: 1000;
      transition: transform 0.1s;
    }
    .dash-btn:active { transform: translateY(2px); }

    #scoreBoard {
      position: absolute;
      top: 20px;
      right: 20px;
      left: auto;
      color: white;
      font-size: 24px;
      font-family: 'Arial Black', sans-serif;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 18px;
      border-radius: 20px;
      border: 2px solid #f39c12;
      z-index: 100;
      text-shadow: 2px 2px 4px #000;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.4);
      pointer-events: none;
      display: none;
    }

    #pauseBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 25px;
      display: none;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      z-index: 100;
      border: 2px solid #4facfe;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
      backdrop-filter: blur(5px);
      transition: transform 0.1s;
      gap: 6px;
    }
    #pauseBtn .btn-icon { font-size: 14px; line-height: 1; font-weight: bold; }
    #pauseBtn .btn-label { font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
    #pauseBtn:active { transform: scale(0.95); }

    #inGameHomeBtn {
      position: absolute;
      top: 75px;
      right: 20px;
      left: auto;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 25px;
      display: none;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      z-index: 100;
      border: 2px solid #ff4757;
      box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      backdrop-filter: blur(5px);
      transition: transform 0.1s;
      gap: 6px;
    }
    #inGameHomeBtn .btn-icon { font-size: 16px; line-height: 1; }
    #inGameHomeBtn .btn-label { font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
    #inGameHomeBtn:active { transform: scale(0.95); }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      backdrop-filter: blur(5px);
    }

    .panel {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 4px solid #fff;
      color: white;
      min-width: 300px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .panel h2 {
      margin-top: 0;
      font-size: 36px;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
      letter-spacing: 2px;
    }

    .score-display {
      font-size: 24px;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 1px 1px 2px #000;
    }

    .game-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      font-size: 24px;
      font-weight: bold;
      border: 3px solid rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      color: white;
      cursor: pointer;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      box-shadow: 0 6px 0 #000, 0 8px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .game-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 #000, 0 2px 5px rgba(0,0,0,0.3);
    }

    .btn-resume { background: linear-gradient(to bottom, #4facfe, #00f2fe); }
    .btn-ad { background: linear-gradient(to bottom, #43e97b, #38f9d7); color: #000; text-shadow: none; }
    .btn-restart { background: linear-gradient(to bottom, #ff0844, #ffb199); }
    .btn-home { background: linear-gradient(to bottom, #f39c12, #e67e22); }

    .btn-play {
      background: linear-gradient(to bottom, #2ecc71, #27ae60);
      width: 250px;
      font-size: 30px;
      padding: 20px;
    }

    #homeScreen, #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 150;
      color: white;
    }

    #loadingScreen { display: none; z-index: 999; }

    .game-title, #loadingTitle {
      font-size: 50px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 3px 3px 6px #000;
      letter-spacing: 2px;
      color: #f1c40f;
    }

    #progressContainer {
      width: 300px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      border: 3px solid #fff;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #progressBar { width: 0%; height: 100%; background: #ffd700; transition: 0.1s; }
    #loadingText { margin-top: 10px; font-size: 18px; }

    @media (max-width: 768px) {
      .panel { min-width: min(88vw, 320px); padding: 20px 16px; border-width: 3px; }
      .panel h2 { font-size: clamp(24px, 6vw, 32px); margin-bottom: 12px; }
      .score-display { font-size: clamp(18px, 4.8vw, 24px); margin-bottom: 14px; }
      .game-btn { padding: 12px; margin: 10px 0; font-size: clamp(18px, 4.2vw, 22px); border-radius: 10px; }
      .btn-play { width: min(84vw, 250px); font-size: clamp(22px, 5.4vw, 28px); padding: 16px; }

      #pauseBtn {
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        padding: 6px 12px;
      }
      #pauseBtn .btn-label { font-size: 10px; }
      #pauseBtn .btn-icon { font-size: 12px; }

      #scoreBoard {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        font-size: clamp(16px, 4vw, 20px);
        padding: 6px 14px;
        border-width: 2px;
      }

      #inGameHomeBtn {
        top: calc(max(12px, env(safe-area-inset-top)) + 55px);
        right: max(12px, env(safe-area-inset-right));
        padding: 6px 12px;
      }
      #inGameHomeBtn .btn-label { font-size: 10px; }
      #inGameHomeBtn .btn-icon { font-size: 14px; }

      .game-title, #loadingTitle {
        font-size: clamp(32px, 9vw, 48px);
        margin-bottom: 20px;
        text-align: center;
      }

      #progressContainer { width: min(82vw, 300px); }

      #scoreBoard, #pauseBtn, #inGameHomeBtn, .overlay {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      #scoreBoard, #pauseBtn, #inGameHomeBtn {
        box-shadow: none !important;
        text-shadow: none !important;
      }
    }

    @media (max-width: 480px) {
      .panel { width: min(92vw, 320px); }
      .game-btn { padding: 11px; font-size: 17px; }
    }
  </style>
</head>

<body>
  <div id="scoreBoard">
    <span id="scoreVal" style="letter-spacing: 2px;">000000</span>
  </div>

  <div id="pauseBtn" onclick="togglePause()"><span class="btn-icon">||</span><span class="btn-label">Pause</span></div>
  <div id="inGameHomeBtn" onclick="goHome()"><span class="btn-icon">←</span><span class="btn-label">Back to Home</span></div>

  <div id="homeScreen">
    <div class="dash-btn" onclick="window.location.href='index.html'">← Back to Dashboard</div>
    <img src="icons/ivgames-logo.webp" alt="IV Games Logo" style="height: 65px; width: auto; object-fit: contain; margin-bottom: 15px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));">
    <div class="game-title">Bus Runner</div>
    <button class="game-btn btn-play" onclick="startGame()">▶ Tap To Play</button>
  </div>

  <div id="loadingScreen">
    <div class="dash-btn" onclick="window.location.href='index.html'">← Back to Dashboard</div>
    <img src="icons/ivgames-logo.webp" alt="IV Games Logo" style="height: 65px; width: auto; object-fit: contain; margin-bottom: 15px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));">
    <div id="loadingTitle">Bus Runner</div>
    <div id="progressContainer"><div id="progressBar"></div></div>
    <div id="loadingText">Loading City...0%</div>
  </div>

  <div id="pauseScreen" class="overlay">
    <div class="panel">
      <h2>PAUSED</h2>
      <button class="game-btn btn-resume" onclick="togglePause()">▶ Resume Game</button>
      <button class="game-btn btn-restart" onclick="resetGame()">↻ Restart</button>
      <button class="dash-btn btn-back-to-dashboard" onclick="window.location.href='index.html'">← Back to Dashboard</button>
    </div>
  </div>

  <div id="gameOverScreen" class="overlay">
    <div class="panel">
      <h2>GAME OVER</h2>
      <div class="score-display"> Final Score: <span id="finalScoreVal">0</span></div>
      <button id="adBtn" class="game-btn btn-ad" onclick="watchAdToResume()">Watch Ad (3 Left)</button>
      <button class="game-btn btn-restart" onclick="resetGame()">↻ Restart</button>
      <button class="game-btn btn-home" onclick="goHome()"> Back to Home</button>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="DRACOLoader.js"></script>

  <script>

     function updateFavicon(theme) {
        const favicon = document.getElementById('favicon');
        if (favicon) {
            favicon.href = theme === 'dark' ? 'favicon/favicon.dark.webp' : 'favicon/favicon.light.webp';
        }
    }

    const htmlElement = document.documentElement;
    const savedTheme = localStorage.getItem('ivGamesTheme') || 'dark';
    
    htmlElement.setAttribute('data-theme', savedTheme);
    updateFavicon(savedTheme);
    
    window.addEventListener('storage', (event) => {
        if (event.key === 'ivGamesTheme' || !event.key) {
            const newTheme = localStorage.getItem('ivGamesTheme') || 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            updateFavicon(newTheme);
        }
    });

    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const deviceMemory = Number(navigator.deviceMemory) || 4;
    const processorCores = Number(navigator.hardwareConcurrency) || 4;
    const isBudgetMobile = isMobile && (deviceMemory <= 2 || processorCores <= 4);

    const mobileMinPixelRatio = isBudgetMobile ? 0.75 : 0.85;
    const mobileMaxPixelRatio = isBudgetMobile ? 0.9 : (deviceMemory >= 6 && processorCores >= 8 ? 1.2 : 1.05);
    let mobilePixelRatio = mobileMaxPixelRatio;

    const scoreEl = document.getElementById('scoreVal');
    const homeScreenEl = document.getElementById('homeScreen');
    const loadingScreenEl = document.getElementById('loadingScreen');

    const ACTIVE_Z_MIN = -90;
    const ACTIVE_Z_MAX = 25;
    const scene = new THREE.Scene();

    const textureLoader = new THREE.TextureLoader();
    const skyTexture = textureLoader.load('image/sky.webp');
    skyTexture.encoding = THREE.sRGBEncoding;
    skyTexture.generateMipmaps = false;
    skyTexture.minFilter = THREE.LinearFilter;

 const skyGeo = new THREE.PlaneGeometry(1600, 800); 
    const skyMat = new THREE.MeshBasicMaterial({
      map: skyTexture,
      fog: false,
      depthWrite: false,
      side: THREE.FrontSide
    });
    const skyPlane = new THREE.Mesh(skyGeo, skyMat);
    
    skyPlane.position.set(0, 100, -400); 
    
    skyPlane.frustumCulled = false;
    scene.add(skyPlane);

    const fogColor = 0x87CEEB;
    scene.background = new THREE.Color(fogColor);
    scene.fog = new THREE.FogExp2(fogColor, isMobile ? (isBudgetMobile ? 0.006 : 0.0045) : 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.9, 1000); 

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobile,
      powerPreference: "high-performance",
      preserveDrawingBuffer: false,
      precision: isMobile ? "mediump" : "highp"
    });
    renderer.shadowMap.enabled = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    if (THREE.ACESFilmicToneMapping !== undefined) {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = isMobile ? 1.0 : 1.12;
    }
    document.body.appendChild(renderer.domElement);

    function getViewportSize() {
      const width = window.visualViewport?.width || window.innerWidth || document.documentElement.clientWidth || 1;
      const height = window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 1;
      return { width, height };
    }

    function updateRendererSize() {
      const { width, height } = getViewportSize();
      const mobile = window.matchMedia('(max-width: 768px)').matches;

      const maxRatio = mobile ? mobilePixelRatio : 1.75;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, maxRatio);

      camera.aspect = width / height;
      camera.fov = Math.min(78, Math.max(58, mobile ? 72 : 60));
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height, false);
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
    }

    function setMobilePixelRatio(nextRatio) {
      const limitedRatio = Math.max(mobileMinPixelRatio, Math.min(mobileMaxPixelRatio, nextRatio));
      if (Math.abs(limitedRatio - mobilePixelRatio) < 0.04) return;
      mobilePixelRatio = limitedRatio;
      updateRendererSize();
    }

    updateRendererSize();

    const ambientLight = new THREE.AmbientLight(0xffffff, isMobile ? 0.9 : 0.72);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, isMobile ? 1.1 : 1.35);
    dirLight.position.set(0, 50, -200);
    scene.add(dirLight);

    const roadGeo = new THREE.BoxGeometry(12, 0.1, 500);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.position.set(0, -0.1, -200);
    scene.add(road);

    const lanes = [-3.5, 0, 3.5];
    const sleeperGeo = new THREE.BoxGeometry(2.2, 0.1, 0.6);
    const sleeperMat = new THREE.MeshBasicMaterial({ color: 0x5c2e0e });

    const SLEEPER_STEP = isMobile ? 4 : 3;  
    const SLEEPER_Z_START = 10;
    const SLEEPER_Z_END = -400;

    let sleeperCount = 0;
    for (let z = SLEEPER_Z_START; z > SLEEPER_Z_END; z -= SLEEPER_STEP) sleeperCount++;
    const totalSleepers = sleeperCount * lanes.length;

    const sleeperInstanced = new THREE.InstancedMesh(sleeperGeo, sleeperMat, totalSleepers);
    sleeperInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(sleeperInstanced);

    const dummy = new THREE.Object3D();
    const sleepersData = [];
    let sIdx = 0;
    for (let z = SLEEPER_Z_START; z > SLEEPER_Z_END; z -= SLEEPER_STEP) {
      lanes.forEach(laneX => {
        sleepersData.push({ x: laneX, z });
        dummy.position.set(laneX, 0, z);
        dummy.updateMatrix();
        sleeperInstanced.setMatrixAt(sIdx, dummy.matrix);
        sIdx++;
      });
    }
    sleeperInstanced.instanceMatrix.needsUpdate = true;

    const railGeo = new THREE.BoxGeometry(0.2, 0.15, 500);
    const railMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const railOffsets = [-0.6, 0.6];

    lanes.forEach(laneX => {
      railOffsets.forEach(offset => {
        const rail = new THREE.Mesh(railGeo, railMat);
        rail.position.set(laneX + offset, 0.12, -200);
        scene.add(rail);
      });
    });

    let currentLane = 1;
    let previousLane = 1;
    let score = 0;
    let displayScore = 0;
    let scoreMultiplier = 2;
    let timeAlive = 0;

    let isGameOver = false;
    let remainingRevives = 3;
    let isPaused = false;
    let isGameLoaded = false;

    let obstacles = [];
    let baseSpeed = isMobile ? 0.13 : 0.09;
    let obstacleSpeed = baseSpeed;
    const maxSpeed = isMobile ? 0.22 : 0.175;
    let frameCount = 0;

    let isTilting = false;
    let tiltTimer = 0;
    const tiltDuration = 0.5;
    let tiltDirection = 1;
    let tiltAngle = 0.25;

    let cityBlocksArr = [];
    let cityBlocksRightArr = [];
    let cityBlockLength = 16;
    let cityBlockLengthRight = 17;

    let mixer;
    let characterWrapper;
    let isJumping = false, isRolling = false;
    let runAction, jumpAction1, jumpAction2, rollAction, playerAction, stumbleAction;
    let isStumbling = false;
    let cameraShakeTime = 0;
    let collisionGraceTime = 0;
    let trainCollisionCount = 0;

    let hasLoadedOnce = false;

    const jumpDuration = 0.8;
    const jumpHeight = 2.2;
    const roofHeight = 4.3;
    let jumpTimer = 0;

    const clock = new THREE.Clock();

    const player = new THREE.Group();
    player.position.set(lanes[currentLane], 0, 0);
    scene.add(player);

    const gamePools = { trains: [], obstacles: [], ramps: [] };
    const maxLiveObstacles = isMobile ? (isBudgetMobile ? 65 : 95) : 90;

    function canAddObstacle() {
      return obstacles.length < maxLiveObstacles;
    }

    function updateGameplaySpeed() {
      let targetSpeed = baseSpeed;
      if (timeAlive < 30) {
        targetSpeed = baseSpeed;
      } else if (timeAlive < 80) {
        let progress = (timeAlive - 30) / 50;
        targetSpeed = baseSpeed + (0.13 - baseSpeed) * progress;
      } else if (timeAlive < 120) {
        let progress = (timeAlive - 80) / 40;
        targetSpeed = 0.13 + (maxSpeed - 0.13) * progress;
      } else {
        targetSpeed = maxSpeed;
      }

      if (Math.abs(obstacleSpeed - targetSpeed) > 0.0005) {
        obstacleSpeed = targetSpeed;

        let animScale = obstacleSpeed / baseSpeed;
        if (animScale > 1.6) animScale = 1.6;
        if (playerAction) playerAction.timeScale = animScale;
      }
    }

    function showGameUI() {
      document.getElementById('scoreBoard').style.display = 'block';
      document.getElementById('pauseBtn').style.display = 'flex';
      document.getElementById('inGameHomeBtn').style.display = 'flex';
    }

    function hideGameUI() {
      document.getElementById('scoreBoard').style.display = 'none';
      document.getElementById('pauseBtn').style.display = 'none';
      document.getElementById('inGameHomeBtn').style.display = 'none';
    }

    let customObstacles = [];
    let trainModel = null, trainModel2 = null, trainModel3 = null;

    function tuneTexture(texture, anisotropy) {
      if (!texture) return;
      texture.anisotropy = Math.min(anisotropy, renderer.capabilities.getMaxAnisotropy());
      texture.needsUpdate = true;
    }

    function createMobileMaterial(sourceMaterial) {
      const material = new THREE.MeshLambertMaterial({
        color: sourceMaterial.color ? sourceMaterial.color.clone() : 0xffffff,
        map: sourceMaterial.map || null,
        transparent: sourceMaterial.transparent,
        opacity: sourceMaterial.opacity,
        side: sourceMaterial.side,
        alphaTest: sourceMaterial.alphaTest || 0,
        fog: sourceMaterial.fog !== false
      });

      if (sourceMaterial.emissive) material.emissive.copy(sourceMaterial.emissive);
      material.depthWrite = sourceMaterial.depthWrite;
      material.name = sourceMaterial.name;
      tuneTexture(material.map, 2);
      return material;
    }

    function optimizeMaterial(material) {
      if (!material) return material;

      if (isMobile) return createMobileMaterial(material);

      tuneTexture(material.map, 8);
      tuneTexture(material.normalMap, 8);
      tuneTexture(material.roughnessMap, 8);
      tuneTexture(material.metalnessMap, 8);
      tuneTexture(material.emissiveMap, 8);
      material.needsUpdate = true;
      return material;
    }

    function OptimizeModel(model) {
      model.traverse((child) => {
        if (child.isMesh) {
          if (child.material) {
            child.material = Array.isArray(child.material)
              ? child.material.map(optimizeMaterial)
              : optimizeMaterial(child.material);
          }
          child.castShadow = false;
          child.receiveShadow = false;
        }
      });
      return model;
    }

    function init3DModels() {
      const manager = new THREE.LoadingManager();

      manager.onProgress = function (url, itemsLoaded, itemsTotal) {
        let progress = Math.floor((itemsLoaded / itemsTotal) * 100);
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('loadingText').innerText = 'Loading City...' + progress + '%';
      };

      manager.onLoad = function () {
        document.getElementById('loadingText').innerText = 'Optimizing Graphics... Please wait';

        camera.position.set(0, 3.0, 4.8);
        window.currentLookAtY = 1.2;
        camera.lookAt(0, window.currentLookAtY, -20);

        window.patternSequence = 0;
        for (let i = 0; i < 8; i++) {
          spawnObstacle(-50 - (i * 200));
        }

        let originalFar = camera.far;
        camera.far = 5000;
        camera.updateProjectionMatrix();

        renderer.compile(scene, camera);

        let warmUpFrames = 0;

    function switchAnimation(newAction, duration = 0.2) {
      if (!newAction || playerAction === newAction) return;
      if (duration === 0) {
        mixer.stopAllAction();
        newAction.reset().setEffectiveWeight(1).play();
        playerAction = newAction;
        return;
      }
      newAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1);
      newAction.crossFadeFrom(playerAction, duration, true).play();
      playerAction = newAction;
    }

    window.addEventListener('keydown', (e) => {
      if (isGameOver || isPaused) return;

      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }

      if (e.key === 'ArrowLeft' && currentLane > 0) { previousLane = currentLane; currentLane--; }
      else if (e.key === 'ArrowRight' && currentLane < 2) { previousLane = currentLane; currentLane++; }

      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && !isRolling && !isStumbling) {
        isJumping = true;
        jumpTimer = 0;
        let SelectedJump = Math.random() < 0.5 ? jumpAction1 : jumpAction2;
        if (SelectedJump) { SelectedJump.timeScale = 1.8; switchAnimation(SelectedJump, 0.02); }
      }

      if (e.key === 'ArrowDown' && !isRolling && !isStumbling) {
        if (isJumping) { isJumping = false; jumpTimer = 0; player.fallSpeed = 0.4; }

        isRolling = true;
        switchAnimation(rollAction, 0.05);
        setTimeout(() => {
          isRolling = false;
          if (!isGameOver && !isJumping && !isStumbling && !isPaused) switchAnimation(runAction);
        }, 800);
      }
    });

    let startX = 0, startY = 0, endX = 0, endY = 0;
    const minSwipeDistance = 30;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
    }, { passive: true });

    renderer.domElement.addEventListener('pointerup', (e) => {
      endX = e.clientX;
      endY = e.clientY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      if (isGameOver || isPaused) return;
      const dx = endX - startX;
      const dy = endY - startY;

      if (Math.abs(dx) < minSwipeDistance && Math.abs(dy) < minSwipeDistance) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && currentLane < 2) { previousLane = currentLane; currentLane++; }
        else if (dx < 0 && currentLane > 0) { previousLane = currentLane; currentLane--; }
      } else {
        if (dy < 0 && !isJumping && !isRolling && !isStumbling) {
          isJumping = true; jumpTimer = 0;
          let SelectedJump = Math.random() < 0.5 ? jumpAction1 : jumpAction2;
          if (SelectedJump) { SelectedJump.timeScale = 1.8; switchAnimation(SelectedJump, 0.02); }
        } else if (dy > 0 && !isJumping && !isRolling && !isStumbling) {
          isRolling = true;
          switchAnimation(rollAction, 0.05);
          setTimeout(() => {
            isRolling = false;
            if (!isGameOver && !isJumping && !isStumbling && !isPaused) switchAnimation(runAction);
          }, 800);
        }
      }
    }

    function addTrain(laneIndex, zPos, isMoving, hasRamp, isTriggerTrain = false) {
      if (!canAddObstacle()) return;
      let trainGroup;

      if (gamePools.trains.length > 0) {
        trainGroup = gamePools.trains.pop();
        trainGroup.visible = true;
      } else {
        let availableTrains = [];
        if (trainModel) availableTrains.push(trainModel);
        if (trainModel2) availableTrains.push(trainModel2);
        if (trainModel3) availableTrains.push(trainModel3);
        if (availableTrains.length === 0) return;

        let selectedTrain = availableTrains[Math.floor(Math.random() * availableTrains.length)];
        trainGroup = selectedTrain.clone();
        trainGroup.baseY = selectedTrain.baseY;
        trainGroup.zHitbox = selectedTrain.zHitbox ? selectedTrain.zHitbox : 12;
        trainGroup.rampOffset = selectedTrain.rampOffset ? selectedTrain.rampOffset : 13.5;
        scene.add(trainGroup);
      }

      trainGroup.passed = false;
      trainGroup.type = 1;
      trainGroup.isTrain = true;
      trainGroup.hasRampAttached = hasRamp;
      trainGroup.isMovingTrain = isMoving;
      trainGroup.hasCollided = false;
      trainGroup.lastCollisionTime = 0;
      trainGroup.isTriggerTrain = isTriggerTrain || false;

      trainGroup.position.set(lanes[laneIndex], trainGroup.baseY, zPos);
      obstacles.push(trainGroup);

      if (hasRamp && customObstacles.length > 0) {
        let rampGroup;
        if (gamePools.ramps.length > 0) {
          rampGroup = gamePools.ramps.pop();
          rampGroup.visible = true;
        } else {
          let rampTemplate = customObstacles.find(o => o.type === 4 || o.model.isRamp || o.model.ramp);
          if (rampTemplate) {
            rampGroup = rampTemplate.model.clone();
            rampGroup.yPos = rampTemplate.yPos;
            scene.add(rampGroup);
          }
        }

        if (rampGroup) {
          rampGroup.passed = false;
          rampGroup.isRamp = true;
          rampGroup.ramp = true;
          rampGroup.type = 4;
          rampGroup.hasCollided = false;
          rampGroup.lastCollisionTime = 0;

          let gap = trainGroup.rampOffset + 0.1;
          rampGroup.position.set(lanes[laneIndex], rampGroup.yPos, zPos + gap);
          obstacles.push(rampGroup);
        }
      }
    }

    function addObstacle(laneIndex, zPos) {
      if (!canAddObstacle()) return;
      let obsGroup;

      if (gamePools.obstacles.length > 0) {
        obsGroup = gamePools.obstacles.pop();
        obsGroup.visible = true;
      } else {
        let validObstacles = customObstacles.filter(o => o.type !== 4);
        if (validObstacles.length === 0) return;
        let selectedItem = validObstacles[Math.floor(Math.random() * validObstacles.length)];

        obsGroup = selectedItem.model.clone();
        obsGroup.type = selectedItem.type;
        obsGroup.yPos = selectedItem.yPos;
        scene.add(obsGroup);
      }

      obsGroup.passed = false;
      obsGroup.hasCollided = false;
      obsGroup.lastCollisionTime = 0;

      if (obsGroup.type === 5) {
        let gaps = [-1.75, 1.75];
        let randomGap = gaps[Math.floor(Math.random() * gaps.length)];
        obsGroup.position.set(randomGap, obsGroup.yPos, zPos);
      } else {
        obsGroup.position.set(lanes[laneIndex], obsGroup.yPos, zPos);
      }
      obstacles.push(obsGroup);
    }

   function spawnObstacle(customZ) {
      if (!trainModel && !trainModel2 && customObstacles.length === 0) return 0;
      let startZ = customZ !== undefined ? customZ : -320;

      if (typeof window.patternSequence === 'undefined') window.patternSequence = 0;
      let patternType = window.patternSequence;
      window.patternSequence++;
      if (window.patternSequence > 3) window.patternSequence = 0;

      let chunkLength = 280; 

      if (patternType === 0) {
        chunkLength = 280;
        addTrain(1, startZ, false, true);
        addTrain(2, startZ - 40, false, false);
        addObstacle(0, startZ - 10);
        addObstacle(0, startZ - 50);
        addObstacle(0, startZ - 90);
        addTrain(0, startZ - 140, false, false);
        addTrain(2, startZ - 150, false, false);
        addTrain(0, startZ - 250, false, false);
        addTrain(2, startZ - 260, false, false);
        addObstacle(1, startZ - 100);
        addObstacle(1, startZ - 150);
        addObstacle(1, startZ - 200);
        addObstacle(1, startZ - 250);
      } 
      else if (patternType === 1) {
        chunkLength = 420;
        addTrain(0, startZ, false, false);
        addTrain(2, startZ, false, false);
        addTrain(1, startZ - 120, false, false);
        addTrain(2, startZ - 120, false, false);
        addObstacle(0, startZ - 180);
        addTrain(0, startZ - 260, false, false);
        addTrain(1, startZ - 260, false, false);
        addObstacle(2, startZ - 320);
        addObstacle(1, startZ - 400);
      } 
      else if (patternType === 2) {
        chunkLength = 220; 
        let tGap = 19; 
        addTrain(1, startZ, false, true);
        for (let i = 1; i <= 6; i++) {
          addTrain(1, startZ - (tGap * i), false, false);
          if (i % 2 !== 0) {
            addTrain(0, startZ - (tGap * i), false, false);
            addTrain(2, startZ - (tGap * i), false, false);
          }
        }
        addObstacle(1, startZ - (tGap * 7) - 20);
        addObstacle(0, startZ - (tGap * 7) - 50);
        addObstacle(2, startZ - (tGap * 7) - 50);
      } 
      else if (patternType === 3) {
        chunkLength = 550;
        let tGap = 19;

        addTrain(0, startZ, false, true); 
        for (let i = 1; i <= 10; i++) { 
          addTrain(0, startZ - (tGap * i), false, false);
        }

        addTrain(2, startZ - 40, false, false);
        addTrain(2, startZ - 150, false, false);
        addTrain(2, startZ - 250, false, false);

        let movingStartZ = startZ - 120; 
        let movingGap = 35; 

        for (let i = 0; i < 6; i++) {
          addTrain(1, movingStartZ - (movingGap * i), false, false, true);
        }

        addObstacle(0, startZ - 500);
        addObstacle(2, startZ - 500);
      }

      return chunkLength; 
    }

    let scoreTimer = 0;
    let homeRenderTimer = 0;
    let lastMobileFrameTime = 0;
    let mobileFrameAccumulator = 0;
    let performanceSampleTime = 0;
    let performanceSampleFrames = 0;

    function monitorMobilePerformance(delta) {
      if (!isMobile || !isGameLoaded) return;

      performanceSampleTime += delta;
      performanceSampleFrames++;

      if (performanceSampleTime < 0.9) return;

      const fps = performanceSampleFrames / performanceSampleTime;
      if (fps < 48) {
        setMobilePixelRatio(mobilePixelRatio - 0.1);
      } else if (fps > 57) {
        setMobilePixelRatio(mobilePixelRatio + 0.05);
      }

      performanceSampleTime = 0;
      performanceSampleFrames = 0;
    }

    function animate(now) {
      requestAnimationFrame(animate);

      if (!isGameLoaded) {
        lastMobileFrameTime = 0;
        mobileFrameAccumulator = 0;
        homeRenderTimer += clock.getDelta();
        if (homeRenderTimer < 0.2) return;
        homeRenderTimer = 0;
        renderer.render(scene, camera);
        return;
      }

      if (isPaused) {
        lastMobileFrameTime = now;
        mobileFrameAccumulator = 0;
        clock.getDelta();
        return;
      }

      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.05);
      const frameScale = Math.min(delta * 60, 3);
      monitorMobilePerformance(rawDelta);

      if (mixer && !isGameOver) mixer.update(delta);

      if (!isGameOver) {
        timeAlive += delta;
        updateGameplaySpeed();

        scoreTimer += delta;
        if (scoreTimer >= 0.1) {
          scoreTimer = 0;
          let speedFactor = 1 + (timeAlive / 60);
          displayScore += (0.25 * scoreMultiplier * speedFactor);
          if (scoreEl) scoreEl.textContent = String(Math.floor(displayScore)).padStart(6, '0');
        }
      }

      if (isGameOver) {
        if (cameraShakeTime > 0) {
          cameraShakeTime -= delta;
          let shakeIntensity = 0.2;
          camera.position.x += (Math.random() - 0.5) * shakeIntensity;
          camera.position.y += (Math.random() - 0.5) * shakeIntensity;
        }
        renderer.render(scene, camera);
        return;
      }

      if (characterWrapper) {
        if (isTilting) {
          tiltTimer += delta;
          let progress = tiltTimer / tiltDuration;
          let sineArc = Math.sin(progress * Math.PI);
          characterWrapper.rotation.z = sineArc * tiltAngle * tiltDirection;
          if (progress >= 1.0) {
            isTilting = false;
            tiltTimer = 0;
            characterWrapper.rotation.z = 0;
          }
        } else if (!isStumbling) {
          characterWrapper.rotation.z = 0;
        }
      }

      let targetBaseY = 0;
      let onSlope = false;
      let onRoof = false;

     
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];

       
        if (obs.isTrain) {
          if (obs.isTriggerTrain && (onRoof || obs.position.z > -90)) {
            obs.isMovingTrain = true;
            obs.isTriggerTrain = false;
          }
          obs.position.z += (obs.isMovingTrain ? (obstacleSpeed + 0.45) : obstacleSpeed) * frameScale;
        } else {
          obs.position.z += obstacleSpeed * frameScale;
        }

        const z = obs.position.z;

        if (z >= ACTIVE_Z_MIN && z <= ACTIVE_Z_MAX) {
          const diffX = Math.abs(player.position.x - obs.position.x);
          if (diffX < 1.5) {
            if (obs.isRamp || obs.type === 4 || obs.ramp) {
              const rampStartZ = -5.5;
              const rampEndZ = 4.5;
              if (z >= rampStartZ && z <= rampEndZ) {
                const progress = (z - rampStartZ) / (rampEndZ - rampStartZ);
                const currentHeight = progress * roofHeight;

                if (currentHeight >= targetBaseY) {
                  if (player.position.y >= currentHeight - 1.2 || progress < 0.15) {
                    targetBaseY = currentHeight;
                    onSlope = true;
                  }
                }
              }
            }

            if (obs.isTrain) {
              const roofLimit = obs.zHitbox ? (obs.zHitbox + 1.5) : 14;
              if (z >= -roofLimit && z <= roofLimit) {
                if (player.position.y > 2.0 && roofHeight > targetBaseY) {
                  targetBaseY = roofHeight;
                  onRoof = true;
                }
              }
            }
          }

          const diffXCol = Math.abs(player.position.x - obs.position.x);
          const diffZCol = Math.abs(player.position.z - z);

          let zHitbox = 0.6;
          if (obs.isTrain) zHitbox = obs.zHitbox;
          else if (obs.isRamp || obs.type === 4 || obs.ramp) zHitbox = 4.8;

          const canCollideNow =
            !obs.isDestroyed &&
            collisionGraceTime <= 0 &&
            diffXCol < 1.2 &&
            diffZCol < zHitbox &&
            (!obs.lastCollisionTime || clock.elapsedTime - obs.lastCollisionTime > 0.55);

          if (canCollideNow) {
            let isHit = false;
            let isStumble = false;
            let isSideBump = false;
            let isSideImpact = (diffXCol > 0.6 && diffXCol < 1.2);

            window.stumbleAngle = -Math.PI / 2;

            if (obs.isRamp || obs.type === 4 || obs.ramp) {
              if (isSideImpact) isSideBump = true;
            } else if (obs.isTrain) {
              if (player.position.y < 3.2 && !onSlope && !onRoof) {
                if (diffXCol < 0.65) {
                  if (!obs.hasRampAttached) isHit = true;
                } else if (isSideImpact) {
                  if (isStumbling) isHit = true;
                  else isSideBump = true;
                }
              }
            } else {
              let legHeight = player.position.y;

              if (obs.type === 5) {
                if (legHeight <= 3.5) {
                  if (isSideImpact) isSideBump = true;
                  else {
                    isStumble = true;
                    window.stumbleAngle = 0;
                    player.position.y = 0.5;
                    player.fallSpeed = -0.15;
                  }
                }
              } else {
                if (isSideImpact) {
                  isSideBump = true;
                } else {
                  if (obs.type === 0) {
                    if (legHeight < 0.3) isHit = true;
                    else if (legHeight >= 0.3 && legHeight < 1.2 && !isRolling) {
                      isStumble = true;
                      player.position.y = 0.8;
                      player.fallSpeed = -0.15;
                    }
                  } else if (obs.type === 2) {
                    if (legHeight < 0.3) {
                      if (!isRolling) isHit = true;
                      else obs.hasCollided = true;
                    } else if (legHeight >= 0.3 && legHeight < 1.1) {
                      if (!isRolling) {
                        isStumble = true;
                        player.position.y = 0.5;
                        player.fallSpeed = -0.15;
                      } else {
                        obs.hasCollided = true;
                      }
                    }
                  } else if (obs.type === 3) {
                    if (legHeight <= 2.5) {
                      if (!isRolling) isHit = true;
                      else obs.hasCollided = true;
                    }
                  }
                }
              }
            }

            if (isHit) {
              obs.lastCollisionTime = clock.elapsedTime;
              collisionGraceTime = 0.35;
              isGameOver = true;
              document.getElementById('finalScoreVal').innerText = Math.floor(displayScore);
              document.getElementById('gameOverScreen').style.display = 'flex';
            } else if (isSideBump) {
              isStumbling = true;
              isTilting = true;
              tiltTimer = 0;
              cameraShakeTime = 0.3;
              tiltDirection = (currentLane > previousLane) ? 1 : -1;
              currentLane = previousLane;
              obs.lastCollisionTime = clock.elapsedTime;
              collisionGraceTime = 0.35;
              if (runAction) runAction.timeScale = 0.6;
              setTimeout(() => {
                isStumbling = false;
                if (!isGameOver && runAction) runAction.timeScale = obstacleSpeed / baseSpeed;
              }, 500);
            } else if (isStumble && !isStumbling) {
              obs.lastCollisionTime = clock.elapsedTime;
              collisionGraceTime = 0.35;
              isStumbling = true;
              cameraShakeTime = 0.3;
              switchAnimation(stumbleAction, 0.1);
              if (stumbleAction) stumbleAction.timeScale = obstacleSpeed / baseSpeed;
              setTimeout(() => {
                isStumbling = false;
                if (!isGameOver) {
                  switchAnimation(runAction, 0.1);
                  if (runAction) runAction.timeScale = obstacleSpeed / baseSpeed;
                }
              }, 800);
            }
          }

          if (!obs.passed && !obs.isDestroyed && z > player.position.z + 1) {
            obs.passed = true;
            score += 1;
          }
        }

        if (z > 15 || obs.isDestroyed) {
          obs.visible = false;
          if (obs.isTrain) gamePools.trains.push(obs);
          else if (obs.isRamp || obs.ramp || obs.type === 4) gamePools.ramps.push(obs);
          else gamePools.obstacles.push(obs);
          obstacles.splice(i, 1);
        }
      }

      if (player.fallSpeed === undefined) player.fallSpeed = 0;

      if (isJumping) {
        if (jumpTimer === 0) player.jumpBaseHeight = player.position.y;
        jumpTimer += delta;
        let progress = jumpTimer / jumpDuration;

        if (progress <= 1.0) {
          let sineArc = Math.sin(progress * Math.PI);
          let jumpY = player.jumpBaseHeight + (sineArc * jumpHeight);

          if ((onSlope || onRoof) && jumpY <= targetBaseY) {
            isJumping = false;
            jumpTimer = 0;
            player.position.y = targetBaseY;
            player.fallSpeed = 0;
            if (playerAction !== runAction && !isRolling) switchAnimation(runAction, 0.1);
          } else {
            player.position.y = jumpY;
          }
        } else {
          isJumping = false;
          jumpTimer = 0;
          player.fallSpeed = 0;
        }
      } else {
        if (onSlope || onRoof) {
          player.position.y = targetBaseY;
          player.fallSpeed = 0;
          if (playerAction !== runAction && !isRolling) switchAnimation(runAction, 0.1);
        } else if (player.position.y > targetBaseY) {
          player.fallSpeed += 0.15;
          player.position.y -= player.fallSpeed;
          if (player.position.y <= targetBaseY) {
            player.position.y = targetBaseY;
            player.fallSpeed = 0;
            if (playerAction !== runAction && !isRolling) switchAnimation(runAction, 0.1);
          } else {
            if (playerAction !== jumpAction1 && !isRolling) switchAnimation(jumpAction1, 0.2);
          }
        } else {
          player.position.y = targetBaseY;
          player.fallSpeed = 0;
          if (playerAction !== runAction && !isRolling) switchAnimation(runAction, 0.1);
        }
      }

     frameCount++;
      const updateSleepers = true; 
      if (updateSleepers) {
        for (let i = 0; i < totalSleepers; i++) {
          let sData = sleepersData[i];
          sData.z += obstacleSpeed * frameScale * (isMobile ? 2 : 1);
          if (sData.z > 15) sData.z -= 410;

          dummy.position.set(sData.x, 0, sData.z);
          dummy.updateMatrix();
          sleeperInstanced.setMatrixAt(i, dummy.matrix);
        }
        sleeperInstanced.instanceMatrix.needsUpdate = true;
      }

      for (let i = 0; i < cityBlocksArr.length; i++) {
        let block = cityBlocksArr[i];
        block.position.z += obstacleSpeed * frameScale;
        if (block.position.z > 20) block.position.z -= (cityBlockLength * cityBlocksArr.length);
      }
      for (let i = 0; i < cityBlocksRightArr.length; i++) {
        let block = cityBlocksRightArr[i];
        block.position.z += obstacleSpeed * frameScale;
        if (block.position.z > 20) block.position.z -= (cityBlockLengthRight * cityBlocksRightArr.length);
      }

      let turnSpeed = isMobile ? 20 : 12;
      player.position.x += (lanes[currentLane] - player.position.x) * (1 - Math.exp(-turnSpeed * delta));

      if (typeof window.lastChunkZ === 'undefined' || isNaN(window.lastChunkZ)) {
          window.lastChunkZ = -600; 
      }
      
      window.lastChunkZ += obstacleSpeed * frameScale;
      while (window.lastChunkZ > -400) {
        let len = spawnObstacle(window.lastChunkZ);
        if (!len) {
            window.lastChunkZ -= 280; 
            break; 
        }
        window.lastChunkZ -= len;
      }

      if (collisionGraceTime > 0) collisionGraceTime -= delta;


      let desiredCamY = (onRoof || player.position.y > 2.5) ? 6.2 : 3.0;
      camera.position.x += (player.position.x - camera.position.x) * (delta * 8);
      camera.position.y += (desiredCamY - camera.position.y) * (delta * 4);
      camera.position.z = 4.8;

      const targetLookAtY = onRoof ? 3.0 : 1.2;
      if (!window.currentLookAtY) window.currentLookAtY = 1.2;
      window.currentLookAtY += (targetLookAtY - window.currentLookAtY) * 0.08;
      camera.lookAt(player.position.x * 0.5, window.currentLookAtY, -20);

      let targetPitch = (onSlope && !onRoof) ? -0.25 : ((isJumping || player.position.y > 0.05) ? 0.1 : 0);
      player.rotation.x += (targetPitch - player.rotation.x) * 0.15;

      if (characterWrapper && !isTilting) {
        if (isStumbling) characterWrapper.rotation.x = window.stumbleAngle;
        else characterWrapper.rotation.x = 0;
      }

      if (cameraShakeTime > 0) {
        cameraShakeTime -= delta;
        let shakeIntensity = 0.2;
        camera.position.x += (Math.random() - 0.5) * shakeIntensity;
        camera.position.y += (Math.random() - 0.5) * shakeIntensity;
      }

      renderer.render(scene, camera);
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (!isPaused && !isGameOver && isGameLoaded) togglePause();
      }
    });

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;

      if (isPaused) {
        document.getElementById('pauseScreen').style.display = 'flex';
        if (mixer) mixer.timeScale = 0;
      } else {
        document.getElementById('pauseScreen').style.display = 'none';
        if (mixer) mixer.timeScale = 1;
      }
    }

   function hardResetGameplay() {
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('pauseScreen').style.display = 'none';

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        if (obs) {
          obs.visible = false;
          if (obs.isTrain) gamePools.trains.push(obs);
          else if (obs.isRamp || obs.ramp || obs.type === 4) gamePools.ramps.push(obs);
          else gamePools.obstacles.push(obs);
        }
      }
      obstacles = [];

      remainingRevives = 3;
      let adBtn = document.getElementById('adBtn');
      if (adBtn) {
        adBtn.innerText = "Watch Ad (3 Left)";
        adBtn.style.display = "block";
      }

      score = 0;
      displayScore = 0;
      timeAlive = 0;
      if (scoreEl) scoreEl.textContent = '000000';

      frameCount = 0;
      obstacleSpeed = baseSpeed;
      window.patternSequence = 0;
      
      window.lastChunkZ = -50; 
      while (window.lastChunkZ > -600) {
        let len = spawnObstacle(window.lastChunkZ);
        if (!len) break;
        window.lastChunkZ -= len;
      }

      currentLane = 1;
      previousLane = 1;

      if (characterWrapper) {
        characterWrapper.rotation.set(0, Math.PI, 0);
        characterWrapper.position.set(0, 0, 0);
      }

      player.position.set(lanes[currentLane], 0, 0);
      player.rotation.set(0, 0, 0);
      player.fallSpeed = 0;

      camera.position.set(0, 3.0, 4.8);
      window.currentLookAtY = 1.2;

      isTilting = false;
      isStumbling = false;
      isJumping = false;
      isRolling = false;
      isPaused = false;
      isGameOver = false;
      trainCollisionCount = 0;

      if (mixer) {
        mixer.timeScale = 1;
        mixer.stopAllAction();
      }

      if (runAction) {
        runAction.reset().play();
        runAction.timeScale = 1;
        playerAction = runAction;
      }
    }

    function watchAdToResume() {
      if (remainingRevives <= 0) return;
      remainingRevives--;

      let panel = document.querySelector('#gameOverScreen .panel');
      let originalHTML = panel.innerHTML;
      panel.innerHTML = "<h2> Playing Ad...</h2><p style='color:#fff; font-size:18px;'>Please wait...</p>";

      setTimeout(() => {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          if (obs.position.z > -80 && obs.position.z < 20) {
            obs.visible = false;
            if (obs.isTrain) gamePools.trains.push(obs);
            else if (obs.isRamp || obs.ramp || obs.type === 4) gamePools.ramps.push(obs);
            else gamePools.obstacles.push(obs);
            obstacles.splice(i, 1);
          }
        }

        let rampTemplate = customObstacles.find(o => o.type === 4 || o.model.isRamp || o.model.ramp);
        if (rampTemplate) {
          const rampGroup = rampTemplate.model.clone();
          rampGroup.passed = false;
          rampGroup.isRamp = true;
          rampGroup.ramp = true;
          rampGroup.type = 4;
          rampGroup.hasCollided = false;
          rampGroup.lastCollisionTime = 0;
          rampGroup.position.set(lanes[currentLane], rampTemplate.yPos, -30);
          scene.add(rampGroup);
          obstacles.push(rampGroup);
        }

        if (characterWrapper) {
          characterWrapper.rotation.x = 0;
          characterWrapper.rotation.y = Math.PI;
          characterWrapper.position.y = 0;
        }
        player.position.set(lanes[currentLane], 0, 0);
        player.fallSpeed = 0;

        baseSpeed = isMobile ? 0.13 : 0.09;
        obstacleSpeed = baseSpeed;

        isGameOver = false;
        isStumbling = false;
        document.getElementById('gameOverScreen').style.display = 'none';

        panel.innerHTML = originalHTML;
        let adBtn = document.getElementById('adBtn');
        if (adBtn) {
          if (remainingRevives > 0) adBtn.innerText = `Watch Ad (${remainingRevives} Left)`;
          else adBtn.style.display = 'none';
        }

        if (mixer) mixer.timeScale = 1;
        if (runAction) {
          switchAnimation(runAction, 0);
          runAction.timeScale = 1;
        }
      }, 2000);
    }

    function resetGame() {
      hardResetGameplay();
    }

    function startGame() {
      homeScreenEl.style.display = 'none';
      loadingScreenEl.style.display = 'flex';

      if (!hasLoadedOnce) {
        init3DModels();
        hasLoadedOnce = true;
      } else {
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('loadingText').innerText = 'Ready!';
        setTimeout(() => {
          loadingScreenEl.style.display = 'none';
          showGameUI();
          isGameLoaded = true;
          resetGame();
        }, 300);
      }
    }

    function goHome() {
      document.getElementById('pauseScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      homeScreenEl.style.display = 'flex';
      hideGameUI();
      isGameLoaded = false;
      isPaused = false;
    }

    window.addEventListener('resize', updateRendererSize, { passive: true });
    window.addEventListener('orientationchange', updateRendererSize, { passive: true });
    window.visualViewport?.addEventListener('resize', updateRendererSize, { passive: true });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
